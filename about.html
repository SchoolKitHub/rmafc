  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

4.4vw, 40px); line-height: 1.25; letter-spacing: .01em; color: var(--hero-ink); max-width: 400px; width: 503px; height: 197px\" data-r=\"theme\">Unlocking Investment Opportunities in Nigeria's Oil &amp; Gas Sector For Revenue Enhancement.<\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"font-size: 20px; line-height: 1.55; color: var(--hero-dim); margin: 0 0 36px; max-width: 44ch; text-wrap: pretty; animation: fadeUp .9s .2s cubic-bezier(.2,.7,.2,1) both;\">Nigeria's leading investment opportunity for the oil &amp; gas sector. Two days in Beijing convening international capital, Nigerian operators, government and technical partners.<\u002Fp>\n            <div style=\"display: flex; gap: 14px; flex-wrap: wrap; animation: fadeUp .9s .3s cubic-bezier(.2,.7,.2,1) both;\" data-r=\"cta\">\n              <a href=\"{{ hrefRegister }}\" sc-camel-on-click=\"{{ goRegister }}\" style=\"background: var(--accent); color: var(--on-accent); padding: 15px 28px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; text-decoration: none;\" style-hover=\"opacity: .88;\">Register to attend<\u002Fa>\n              <a href=\"{{ hrefInvest }}\" sc-camel-on-click=\"{{ goInvest }}\" style=\"border: 1px solid var(--hero-line); color: var(--hero-ink); padding: 15px 28px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; text-decoration: none;\" style-hover=\"border-color: var(--accent); color: var(--accent);\">Investment opportunities<\u002Fa>\n              <a href=\"{{ hrefAbout }}\" sc-camel-on-click=\"{{ goAbout }}\" style=\"color: var(--hero-dim); padding: 15px 4px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; text-decoration: none;\" style-hover=\"color: var(--accent);\">Learn more →<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border-left: 1px solid var(--hero-line); border-top: 1px solid var(--hero-line); background: rgba(8,14,26,.55); backdrop-filter: blur(2px); animation: fadeUp 1s .38s cubic-bezier(.2,.7,.2,1) both;\">\n            <div style=\"padding: 22px 24px; border-bottom: 1px solid var(--hero-line);\">\n              <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .18em; color: #7f8ca3; margin-bottom: 8px;\">DATE &amp; VENUE<\u002Fdiv>\n              <div style=\"font-family: Oswald, sans-serif; font-size: 24px; letter-spacing: .02em;\">{{ dateLabel }}<\u002Fdiv>\n              <div style=\"font-size: 14px; color: var(--hero-dim); margin-top: 5px;\">{{ venueLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ showCountdown }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"padding: 22px 24px; border-bottom: 1px solid var(--hero-line);\">\n                <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .18em; color: #7f8ca3; margin-bottom: 14px;\">COUNTDOWN TO OPENING CEREMONY<\u002Fdiv>\n                <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--hero-line);\" data-r=\"countdown\">\n                  <sc-for list=\"{{ countdown }}\" as=\"c\" hint-placeholder-count=\"4\">\n                    <div style=\"background: var(--hero); padding: 14px 10px; text-align: center;\">\n                      <div style=\"font-family: Oswald, sans-serif; font-size: 34px; line-height: 1;\" data-r=\"cd-n\">{{ c.v }}<\u002Fdiv>\n                      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: .16em; color: #7f8ca3; margin-top: 8px;\">{{ c.k }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"padding: 22px 24px;\">\n              <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .18em; color: #7f8ca3; margin-bottom: 14px;\">PROGRAMME AT A GLANCE<\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n                <sc-for list=\"{{ glance }}\" as=\"g\" hint-placeholder-count=\"4\">\n                  <div style=\"display: flex; align-items: baseline; gap: 14px; font-size: 14px;\">\n                    <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--accent); width: 46px; flex: none;\">{{ g.t }}<\u002Fspan>\n                    <span style=\"color: var(--hero-ink);\">{{ g.s }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ goProgramme }}\" style=\"margin-top: 18px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); cursor: pointer;\">Full programme →<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"background: var(--hero); border-top: 1px solid var(--hero-line); overflow: hidden;\">\n        <div style=\"display: flex; width: max-content; padding: 15px 0; animation: marquee 52s linear infinite;\">\n          <sc-for list=\"{{ ticker }}\" as=\"t\" hint-placeholder-count=\"20\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .18em; color: #8592aa; padding: 0 26px; white-space: nowrap;\">{{ t }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section data-r=\"sec\" style=\"border-bottom: 1px solid var(--line); background: var(--surface);\">\n        <div style=\"max-width: 1240px; margin: 0 auto; padding: 72px 32px;\">\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .18em; color: var(--muted); margin-bottom: 32px;\">NIGERIA'S RESOURCE POSITION · NUPRC, AS OF 1 JANUARY 2026<\u002Fdiv>\n          <div data-r=\"g4\" style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line);\">\n            <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"background: var(--surface); padding: 30px 24px;\">\n                <div style=\"font-family: Oswald, sans-serif; font-size: clamp(34px, 3.4vw, 52px); line-height: 1; letter-spacing: -.01em;\">{{ s.v }}<\u002Fdiv>\n                <div style=\"font-family: Oswald, sans-serif; font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin-top: 10px;\">{{ s.unit }}<\u002Fdiv>\n                <div style=\"font-size: 14px; line-height: 1.55; color: var(--muted); margin-top: 12px;\">{{ s.note }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"border-bottom: 1px solid var(--line);\">\n        <div style=\"max-width: 1240px; margin: 0 auto; padding: 0 32px;\">\n          <div data-r=\"themes\" style=\"display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--line); border-left: 1px solid var(--line); border-right: 1px solid var(--line);\">\n            <sc-for list=\"{{ layers }}\" as=\"l\" hint-placeholder-count=\"5\">\n              <div style=\"background: var(--bg); padding: 30px 20px;\">\n                <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--accent); margin-bottom: 12px;\">{{ l.n }}<\u002Fdiv>\n                <div style=\"font-family: Oswald, sans-serif; font-size: 19px; text-transform: uppercase; letter-spacing: .02em; line-height: 1.1;\">{{ l.label }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section data-r=\"split\" style=\"max-width: 1240px; margin: 0 auto; padding: 96px 32px; display: grid; grid-template-columns: 1fr 1.4fr; gap: 64px;\">\n        <div>\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .18em; color: var(--muted); margin-bottom: 20px;\">ABOUT THE SUMMIT<\u002Fdiv>\n          <h2 style=\"font-family: Oswald, sans-serif; font-weight: 500; font-size: 40px; line-height: 1.04; text-transform: uppercase; margin: 0 0 20px;\">Monetise the whole value chain<\u002Fh2>\n          <div sc-camel-on-click=\"{{ goAbout }}\" style=\"font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); cursor: pointer;\">About the summit →<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <p style=\"font-size: 21px; line-height: 1.55; margin: 0 0 24px; text-wrap: pretty;\">Nigeria's investment proposition is no longer simply \"come and drill for oil.\" It is increasingly: come and monetize a huge hydrocarbon resource base across the entire value chain.<\u002Fp>\n          <p style=\"font-size: 17px; line-height: 1.7; color: var(--muted); margin: 0 0 20px; text-wrap: pretty;\">The strongest opportunities sit at the points where Nigeria has abundant resources but inadequate infrastructure, processing capacity, logistics, financing, technology and local participation. The summit convenes the capital, operators and technical partners those points require.<\u002Fp>\n          <p style=\"font-size: 17px; line-height: 1.7; color: var(--muted); margin: 0; text-wrap: pretty;\">NUPRC expects 22 major offshore projects between 2026 and 2030, representing an estimated $30–50 billion of investment, and a new deep-offshore framework is intended to unlock as much as $50 billion.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section data-r=\"sec\" style=\"background: var(--surface-2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);\">\n        <div style=\"max-width: 1240px; margin: 0 auto; padding: 88px 32px;\">\n          <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 24px; margin-bottom: 40px; flex-wrap: wrap;\">\n            <h2 style=\"font-family: Oswald, sans-serif; font-weight: 500; font-size: 34px; text-transform: uppercase; margin: 0;\">Investment themes, 2026–2035<\u002Fh2>\n            <div sc-camel-on-click=\"{{ goInvest }}\" style=\"font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); cursor: pointer; white-space: nowrap;\">All opportunities →<\u002Fdiv>\n          <\u002Fdiv>\n          <div data-r=\"g4\" style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;\">\n            <sc-for list=\"{{ themesPreview }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div sc-camel-on-click=\"{{ goInvest }}\" style=\"background: var(--surface); border: 1px solid var(--line); padding: 26px 22px 22px; cursor: pointer; display: flex; flex-direction: column; gap: 12px; min-height: 200px;\" style-hover=\"border-color: var(--accent);\">\n                <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted);\">{{ s.n }}<\u002Fspan>\n                <span style=\"font-family: Oswald, sans-serif; font-size: 22px; text-transform: uppercase; line-height: 1.1;\">{{ s.name }}<\u002Fspan>\n                <span style=\"font-size: 14px; line-height: 1.55; color: var(--muted); margin-top: auto;\">{{ s.dek }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section data-r=\"sec\" style=\"border-bottom: 1px solid var(--line);\">\n        <div style=\"max-width: 1240px; margin: 0 auto; padding: 88px 32px;\">\n          <h2 style=\"font-family: Oswald, sans-serif; font-weight: 500; font-size: 34px; text-transform: uppercase; margin: 0 0 12px;\">Five bottlenecks, five opportunities<\u002Fh2>\n          <p style=\"font-size: 17px; color: var(--muted); margin: 0 0 40px; max-width: 62ch;\">Nigeria does not primarily suffer from a lack of petroleum. Wherever petroleum is trapped, delayed, wasted or under-monetised, there is an investment opportunity.<\u002Fp>\n          <div data-r=\"g5\" style=\"display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line);\">\n            <sc-for list=\"{{ bottlenecks }}\" as=\"b\" hint-placeholder-count=\"5\">\n              <div style=\"background: var(--bg); padding: 26px 22px; display: flex; flex-direction: column; gap: 10px; min-height: 180px;\">\n                <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--accent);\">{{ b.n }}<\u002Fspan>\n                <span style=\"font-family: Oswald, sans-serif; font-size: 21px; text-transform: uppercase;\">{{ b.k }}<\u002Fspan>\n                <span style=\"font-size: 14px; line-height: 1.55; color: var(--muted); margin-top: auto;\">{{ b.v }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section data-r=\"sec\" style=\"border-top: 1px solid var(--line); background: var(--surface-2);\">\n        <div style=\"max-width: 1240px; margin: 0 auto; padding: 72px 32px;\">\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .18em; color: var(--muted); margin-bottom: 28px;\">THE SECTORS IN VIEW<\u002Fdiv>\n          <div data-r=\"g3\" style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;\">\n            <sc-for list=\"{{ imageBand }}\" as=\"b\" hint-placeholder-count=\"3\">\n              <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n                <div style=\"position: relative; aspect-ratio: 3 / 2; border: 1px solid var(--line); overflow: hidden;\">\n                  <image-slot id=\"{{ b.id }}\" shape=\"rect\" fit=\"cover\" src=\"{{ b.src }}\" placeholder=\"{{ b.ph }}\"><\u002Fimage-slot>\n                <\u002Fdiv>\n                <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .14em; color: var(--muted);\">{{ b.cap }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"border-top: 1px solid var(--line); background: var(--surface);\">\n        <div style=\"max-width: 1240px; margin: 0 auto; padding: 72px 32px;\">\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .18em; color: var(--muted); margin-bottom: 32px;\">SPONSORS, STRATEGIC, MEDIA &amp; GOVERNMENT PARTNERS<\u002Fdiv>\n          <div data-r=\"g6\" style=\"display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px;\">\n            <sc-for list=\"{{ partnerSlots }}\" as=\"p\" hint-placeholder-count=\"6\">\n              <div style=\"position: relative; height: 76px; border: 1px solid var(--line); overflow: hidden;\">\n                <image-slot id=\"{{ p.id }}\" shape=\"rect\" fit=\"contain\" placeholder=\"{{ p.label }}\"><\u002Fimage-slot>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top: 28px; font-size: 15px; color: var(--muted);\">Company logos are displayed with links to their respective websites. <a href=\"{{ hrefRegister }}\" sc-camel-on-click=\"{{ goSponsor }}\" style=\"color: var(--accent); cursor: pointer; text-decoration: none;\">Become a sponsor or partner →<\u002Fa><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section data-r=\"sec\" style=\"max-width: 1240px; margin: 0 auto; padding: 88px 32px;\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 24px; margin-bottom: 36px; flex-wrap: wrap;\">\n          <h2 style=\"font-family: Oswald, sans-serif; font-weight: 500; font-size: 34px; text-transform: uppercase; margin: 0;\">Announcements<\u002Fh2>\n          <div sc-camel-on-click=\"{{ goNews }}\" style=\"font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); cursor: pointer;\">All news →<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top: 1px solid var(--line);\">\n          <sc-for list=\"{{ newsPreview }}\" as=\"n\" hint-placeholder-count=\"3\">\n            <div data-r=\"newsrow\" sc-camel-on-click=\"{{ goNews }}\" style=\"display: grid; grid-template-columns: 130px 130px 1fr; gap: 24px; padding: 22px 0; border-bottom: 1px solid var(--line); cursor: pointer; align-items: baseline;\" style-hover=\"background: var(--surface-2);\">\n              <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .1em; color: var(--accent);\">{{ n.cat }}<\u002Fspan>\n              <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted);\">{{ n.date }}<\u002Fspan>\n              <span style=\"font-size: 19px; line-height: 1.4;\">{{ n.title }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ ABOUT ============ -->\n  <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n    <main data-screen-label=\"About the Summit\">\n      <section style=\"border-bottom: 1px solid var(--line); background: var(--surface);\">\n        <div data-r=\"split\" style=\"max-width: 1240px; margin: 0 auto; padding: 80px 32px 64px; display: grid; grid-template-columns: 1.5fr .8fr; gap: 56px; align-items: center;\">\n          <div>\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .2em; color: var(--accent); margin-bottom: 24px;\">ABOUT · ORGANIZED BY RMAFC<\u002Fdiv>\n            <h1 style=\"font-family: Oswald, sans-serif; font-weight: 500; font-size: clamp(40px, 5vw, 68px); line-height: 1; text-transform: uppercase; margin: 0 0 28px; max-width: 22ch;\">About the summit<\u002Fh1>\n            <p style=\"font-size: 21px; line-height: 1.55; color: var(--muted); max-width: 64ch; margin: 0; text-wrap: pretty;\">The Revenue Mobilisation Allocation and Fiscal Commission convenes investors, government representatives, oil and gas stakeholders, operators, financial institutions and technical partners in Beijing across two days.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border: 1px solid var(--line); background: #ffffff; padding: 34px 28px; display: grid; place-items: center;\">\n            <img src=\"assets/b/648cb93b-a904.png\" alt=\"The Presidency — Revenue Mobilisation Allocation and Fiscal Commission (RMAFC)\" style=\"width: 100%; height: auto; display: block;\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section data-r=\"split\" style=\"max-width: 1240px; margin: 0 auto; padding: 80px 32px; display: grid; grid-template-columns: 300px 1fr; gap: 64px; align-items: start;\">\n        <div data-r=\"sticky\" style=\"position: sticky; top: 104px;\">\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .18em; color: var(--muted); margin-bottom: 16px;\">ON THIS PAGE<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 15px; color: var(--muted);\">\n            <span>Where the market stands<\u002Fspan>\n            <span>Objectives<\u002Fspan>\n            <span>Why attend<\u002Fspan>\n            <span>Who should attend<\u002Fspan>\n            <span>Five investment layers<\u002Fspan>\n            <span>Expected outcomes<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 64px;\">\n          <div>\n            <h2 style=\"font-family: Oswald, sans-serif; font-weight: 500; font-size: 30px; text-transform: uppercase; margin: 0 0 20px;\">Where the market stands<\u002Fh2>\n            <p style=\"font-size: 18px; line-height: 1.65; margin: 0 0 16px; max-width: 68ch;\">Nigeria remains an extraordinarily resource-rich petroleum economy. Production is recovering: average crude production reached about 1.72 million barrels per day in Q2 2026, compared with 1.55 million bpd in Q1.<\u002Fp>\n            <p style=\"font-size: 18px; line-height: 1.65; color: var(--muted); margin: 0 0 24px; max-width: 68ch;\">The government is attempting to reverse the collapse in upstream investment. The 2025 licensing round produced 37 successful blocks with 31 companies emerging as winners, spanning Niger Delta onshore, shallow water, deepwater and frontier basins.<\u002Fp>\n            <div data-r=\"g2\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line);\">\n              <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n                <div style=\"background: var(--bg); padding: 22px 24px;\">\n                  <div style=\"font-family: Oswald, sans-serif; font-size: 34px; line-height: 1;\">{{ s.v }} <span style=\"font-size: 15px; letter-spacing: .06em; color: var(--accent);\">{{ s.unit }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"font-size: 14px; color: var(--muted); margin-top: 8px;\">{{ s.note }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .12em; color: var(--muted); margin-top: 14px;\">SOURCES · NUPRC, REUTERS, NNPC<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div>\n            <h2 style=\"font-family: Oswald, sans-serif; font-weight: 500; font-size: 30px; text-transform: uppercase; margin: 0 0 24px;\">Objectives<\u002Fh2>\n            <div data-r=\"g2\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line);\">\n              <sc-for list=\"{{ objectives }}\" as=\"o\" hint-placeholder-count=\"8\">\n                <div style=\"background: var(--bg); padding: 20px 22px; display: flex; gap: 14px;\">\n                  <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--accent); padding-top: 4px;\">{{ o.n }}<\u002Fspan>\n                  <span style=\"font-size: 16px; line-height: 1.5;\">{{ o.t }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div data-r=\"g2\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 48px;\">\n            <div>\n              <h2 style=\"font-family: Oswald, sans-serif; font-weight: 500; font-size: 30px; text-transform: uppercase; margin: 0 0 20px;\">Why attend<\u002Fh2>\n              <div style=\"display: flex; flex-direction: column;\">\n                <sc-for list=\"{{ whyAttend }}\" as=\"w\" hint-placeholder-count=\"5\">\n                  <div style=\"padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 16px; line-height: 1.5;\">{{ w }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <h2 style=\"font-family: Oswald, sans-serif; font-weight: 500; font-size: 30px; text-transform: uppercase; margin: 0 0 20px;\">Who should attend<\u002Fh2>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n                <sc-for list=\"{{ audiences }}\" as=\"a\" hint-placeholder-count=\"9\">\n                  <span style=\"border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; font-size: 14px;\">{{ a }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div>\n            <h2 style=\"font-family: Oswald, sans-serif; font-weight: 500; font-size: 30px; text-transform: uppercase; margin: 0 0 8px;\">Five investment layers<\u002Fh2>\n            <p style=\"font-size: 16px; color: var(--muted); margin: 0 0 20px; max-width: 60ch;\">The opportunity divides into five layers, and the strategy differs for international and Nigerian capital.<\u002Fp>\n            <div style=\"display: flex; flex-direction: column; gap: 1px; background: var(--line); border: 1px solid var(--line);\">\n              <sc-for list=\"{{ layers }}\" as=\"l\" hint-placeholder-count=\"5\">\n                <div style=\"background: var(--bg); padding: 20px 24px; display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap;\">\n                  <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--accent); width: 24px; flex: none;\">{{ l.n }}<\u002Fspan>\n                  <span style=\"font-family: Oswald, sans-serif; font-size: 21px; text-transform: uppercase; width: 300px; flex: none;\">{{ l.label }}<\u002Fspan>\n                  <span style=\"font-size: 15px; line-height: 1.55; color: var(--muted); flex: 1; min-width: 220px;\">{{ l.dek }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border-left: 3px solid var(--accent); padding: 4px 0 4px 24px;\">\n            <h2 style=\"font-family: Oswald, sans-serif; font-weight: 500; font-size: 30px; text-transform: uppercase; margin: 0 0 16px;\">Expected outcomes<\u002Fh2>\n            <p style=\"font-size: 18px; line-height: 1.65; color: var(--muted); margin: 0; max-width: 68ch;\">Structured partnerships between international capital, Nigerian ownership, technical operators and long-term offtake. Expressions of interest, delegate introductions and follow-up meetings are recorded and published after the summit.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ PROGRAMME ============ -->\n  <sc-if value=\"{{ isProgramme }}\" hint-placeholder-val=\"{{ false }}\">\n    <main data-screen-label=\"Programme\">\n      <section style=\"border-bottom: 1px solid var(--line); background: var(--surface);\">\n        <div style=\"max-width: 1240px; margin: 0 auto; padding: 80px 32px 56px;\">\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .2em; color: var(--accent); margin-bottom: 24px;\">PROGRAMME · {{ dateLabel }}<\u002Fdiv>\n          <h1 style=\"font-family: Oswald, sans-serif; font-weight: 500; font-size: clamp(40px, 5vw, 68px); line-height: 1; text-transform: uppercase; margin: 0 0 24px;\">Summit programme<\u002Fh1>\n          <p style=\"font-size: 18px; color: var(--muted); margin: 0 0 36px; max-width: 62ch;\">Two days at {{ venueLabel }}. Sessions are confirmed progressively and updated by the Commission through the content management system.<\u002Fp>\n          <div style=\"display: flex; gap: 1px; background: var(--line); border: 1px solid var(--line); width: fit-content;\">\n            <sc-for list=\"{{ dayTabs }}\" as=\"d\" hint-placeholder-count=\"2\">\n              <span sc-camel-on-click=\"{{ d.go }}\" style=\"padding: 12px 26px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; white-space: nowrap; background: {{ d.bg }}; color: {{ d.fg }};\">{{ d.label }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section style=\"max-width: 1240px; margin: 0 auto; padding: 56px 32px 96px;\">\n        <div data-r=\"prog-head\" style=\"display: grid; grid-template-columns: 130px 1fr 220px; gap: 28px; padding-bottom: 14px; border-bottom: 1px solid var(--ink); font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .14em; color: var(--muted);\">\n          <span>TIME<\u002Fspan><span>SESSION<\u002Fspan><span>VENUE<\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ programme }}\" as=\"p\" hint-placeholder-count=\"5\">\n          <div data-r=\"prog\" style=\"display: grid; grid-template-columns: 130px 1fr 220px; gap: 28px; padding: 26px 0; border-bottom: 1px solid var(--line); align-items: baseline;\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: var(--accent);\">{{ p.time }}<\u002Fspan>\n            <span>\n              <span style=\"font-family: Oswald, sans-serif; font-size: 24px; text-transform: uppercase; display: block; line-height: 1.15;\">{{ p.title }}<\u002Fspan>\n              <span style=\"font-size: 15px; color: var(--muted); display: block; margin-top: 8px; max-width: 60ch; line-height: 1.55;\">{{ p.dek }}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"font-size: 15px; color: var(--muted);\">{{ p.venue }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"margin-top: 40px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap;\">\n          <a href=\"{{ hrefRegister }}\" sc-camel-on-click=\"{{ goRegister }}\" style=\"background: var(--accent); color: var(--on-accent); padding: 15px 28px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; text-decoration: none;\" style-hover=\"opacity: .88;\">Register to attend<\u002Fa>\n          <span style=\"font-size: 15px; color: var(--muted);\">Programme subject to change. Registered delegates are notified of updates.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ INVESTMENT ============ -->\n  <sc-if value=\"{{ isInvest }}\" hint-placeholder-val=\"{{ false }}\">\n    <main data-screen-label=\"Investment Opportunities\">\n      <section style=\"border-bottom: 1px solid var(--line); background: var(--surface);\">\n        <div data-r=\"hero\" style=\"max-width: 1240px; margin: 0 auto; padding: 80px 32px 64px; display: grid; grid-template-columns: 1.2fr .8fr; gap: 56px; align-items: end;\">\n          <div>\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .2em; color: var(--accent); margin-bottom: 24px;\">OPPORTUNITIES · 2026–2035<\u002Fdiv>\n            <h1 style=\"font-family: Oswald, sans-serif; font-weight: 500; font-size: clamp(40px, 5vw, 68px); line-height: 1; text-transform: uppercase; margin: 0 0 24px; max-width: 20ch;\">Investment opportunities<\u002Fh1>\n            <p style=\"font-size: 18px; line-height: 1.6; color: var(--muted); margin: 0; max-width: 58ch;\">Nigeria's most attractive oil-and-gas investments from 2026 onward are not necessarily the companies that pump the most crude oil. The strongest opportunities sit where resources are abundant but infrastructure, processing, logistics, financing, technology and local participation are not.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border: 1px solid var(--line); padding: 26px; background: var(--bg);\">\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .16em; color: var(--muted); margin-bottom: 12px;\">EXPECTED OFFSHORE INVESTMENT<\u002Fdiv>\n            <div style=\"font-family: Oswald, sans-serif; font-size: 56px; line-height: 1;\">$30–50<span style=\"font-size: 24px;\">BN<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size: 15px; color: var(--muted); margin-top: 10px;\">Across 22 major offshore projects expected between 2026 and 2030 (NUPRC).<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section data-r=\"sec\" style=\"max-width: 1240px; margin: 0 auto; padding: 64px 32px 0;\">\n        <h2 style=\"font-family: Oswald, sans-serif; font-weight: 500; font-size: 30px; text-transform: uppercase; margin: 0 0 8px;\">Top ten themes<\u002Fh2>\n        <p style=\"font-size: 16px; color: var(--muted); margin: 0 0 32px; max-width: 60ch;\">Gas infrastructure and indigenous asset acquisition sit at the centre of the strategy.<\u002Fp>\n        <div data-r=\"g3\" style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;\">\n          <sc-for list=\"{{ themesAll }}\" as=\"s\" hint-placeholder-count=\"10\">\n            <div style=\"border: 1px solid var(--line); background: var(--surface); padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; min-height: 230px;\" style-hover=\"border-color: var(--accent);\">\n              <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted);\">{{ s.n }}<\u002Fspan>\n              <span style=\"font-family: Oswald, sans-serif; font-size: 25px; text-transform: uppercase; line-height: 1.1;\">{{ s.name }}<\u002Fspan>\n              <span style=\"font-size: 15px; line-height: 1.6; color: var(--muted);\">{{ s.dek }}<\u002Fspan>\n              <a href=\"{{ hrefRegister }}\" sc-camel-on-click=\"{{ goRegister }}\" style=\"margin-top: auto; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); cursor: pointer; text-decoration: none;\">Request sector brief →<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section data-r=\"sec\" style=\"max-width: 1240px; margin: 0 auto; padding: 88px 32px 0;\">\n        <div style=\"display: flex; align-items: baseline; gap: 24px; margin-bottom: 8px; flex-wrap: wrap;\">\n          <h2 style=\"font-family: Oswald, sans-serif; font-weight: 500; font-size: 30px; text-transform: uppercase; margin: 0;\">Priorities by investor type<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"font-size: 16px; color: var(--muted); margin: 0 0 28px; max-width: 62ch;\">International capital brings scale, technical capability and a long horizon. Local capital should generally pursue cash flow, contracts and local-content advantage.<\u002Fp>\n        <div style=\"display: flex; gap: 1px; background: var(--line); border: 1px solid var(--line); width: fit-content; margin-bottom: 28px;\">\n          <sc-for list=\"{{ rankTabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n            <span sc-camel-on-click=\"{{ t.go }}\" style=\"padding: 12px 24px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; background: {{ t.bg }}; color: {{ t.fg }};\">{{ t.label }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div data-r=\"rank-head\" style=\"display: grid; grid-template-columns: 60px 1fr 140px; gap: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--ink); font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .14em; color: var(--muted);\">\n          <span>RANK<\u002Fspan><span>OPPORTUNITY<\u002Fspan><span>ATTRACTIVENESS<\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ ranking }}\" as=\"r\" hint-placeholder-count=\"10\">\n          <div data-r=\"rank\" style=\"display: grid; grid-template-columns: 60px 1fr 140px; gap: 24px; padding: 16px 0; border-bottom: 1px solid var(--line); align-items: baseline;\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--accent);\">{{ r.n }}<\u002Fspan>\n            <span style=\"font-size: 17px;\">{{ r.label }}<\u002Fspan>\n            <span style=\"font-size: 15px; letter-spacing: .12em; color: var(--accent);\">{{ r.stars }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsection>\n\n      <section data-r=\"sec\" style=\"max-width: 1240px; margin: 0 auto; padding: 88px 32px 110px;\">\n        <h2 style=\"font-family: Oswald, sans-serif; font-weight: 500; font-size: 30px; text-transform: uppercase; margin: 0 0 8px;\">Opportunities by capital size<\u002Fh2>\n        <p style=\"font-size: 16px; color: var(--muted); margin: 0 0 32px; max-width: 60ch;\">Entry points exist well below the scale of a field acquisition.<\u002Fp>\n        <div data-r=\"g5\" style=\"display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line);\">\n          <sc-for list=\"{{ capitalBands }}\" as=\"c\" hint-placeholder-count=\"5\">\n            <div style=\"background: var(--bg); padding: 26px 22px;\">\n              <div style=\"font-family: Oswald, sans-serif; font-size: 22px; text-transform: uppercase; color: var(--accent); margin-bottom: 16px;\">{{ c.band }}<\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n                <sc-for list=\"{{ c.items }}\" as=\"i\" hint-placeholder-count=\"6\">\n                  <span style=\"font-size: 15px; line-height: 1.45; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 8px;\">{{ i }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ REGISTRATION ============ -->\n  <sc-if value=\"{{ isRegister }}\" hint-placeholder-val=\"{{ false }}\">\n    <main data-screen-label=\"Registration\">\n      <section style=\"border-bottom: 1px solid var(--line); background: var(--surface);\">\n        <div style=\"max-width: 1240px; margin: 0 auto; padding: 80px 32px 56px;\">\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .2em; color: var(--accent); margin-bottom: 24px;\">REGISTRATION<\u002Fdiv>\n          <h1 style=\"font-family: Oswald, sans-serif; font-weight: 500; font-size: clamp(40px, 5vw, 68px); line-height: 1; text-transform: uppercase; margin: 0 0 24px;\">Register for the summit<\u002Fh1>\n          <p style=\"font-size: 18px; color: var(--muted); margin: 0; max-width: 60ch;\">Registration details are sent to the Commission's designated address and stored securely for administrative use.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n        <section style=\"max-width: 720px; margin: 0 auto; padding: 96px 32px 140px; text-align: center;\">\n          <div style=\"width: 56px; height: 56px; margin: 0 auto 28px; border: 1px solid var(--accent); color: var(--accent); display: grid; place-items: center; font-size: 24px;\">✓<\u002Fdiv>\n          <h2 style=\"font-family: Oswald, sans-serif; font-weight: 500; font-size: 38px; text-transform: uppercase; margin: 0 0 18px;\">Registration received<\u002Fh2>\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .14em; color: var(--accent); margin: 0 0 20px;\">{{ refLabel }}<\u002Fdiv>\n          <p style=\"font-size: 18px; line-height: 1.6; color: var(--muted); margin: 0 0 32px;\">Thank you, {{ submittedName }}. A confirmation has been sent to {{ submittedEmail }}. The summit secretariat will follow up with delegate information and programme updates.<\u002Fp>\n          <sc-if value=\"{{ demo }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border: 1px solid var(--line); background: var(--surface); padding: 16px 20px; font-size: 14px; color: var(--muted); margin: 0 auto 32px; max-width: 46ch;\">Preview mode: the registration endpoint is not reachable here. Once deployed on Vercel with the Airtable variables set, submissions are saved and the confirmation email is sent.<\u002Fdiv>\n          <\u002Fsc-if>\n          <span sc-camel-on-click=\"{{ resetForm }}\" style=\"border: 1px solid var(--line); padding: 14px 26px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; display: inline-block;\" style-hover=\"border-color: var(--accent); color: var(--accent);\">Register another delegate<\u002Fspan>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n        <section data-r=\"split\" style=\"max-width: 1240px; margin: 0 auto; padding: 56px 32px 110px; display: grid; grid-template-columns: 1fr 320px; gap: 64px; align-items: start;\">\n          <div>\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .16em; color: var(--muted); margin-bottom: 18px;\">01 · REGISTRATION CATEGORY<\u002Fdiv>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 48px;\">\n              <sc-for list=\"{{ categories }}\" as=\"c\" hint-placeholder-count=\"9\">\n                <span sc-camel-on-click=\"{{ c.pick }}\" style=\"padding: 11px 18px; font-size: 14px; cursor: pointer; border: 1px solid {{ c.border }}; background: {{ c.bg }}; color: {{ c.fg }};\">{{ c.label }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .16em; color: var(--muted); margin-bottom: 18px;\">02 · DELEGATE DETAILS<\u002Fdiv>\n            <div data-r=\"g2\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 20px;\">\n              <label style=\"display: flex; flex-direction: column; gap: 8px;\">\n                <span style=\"font-size: 13px; color: var(--muted);\">Full name<\u002Fspan>\n                <input value=\"{{ f.fullName }}\" sc-camel-on-change=\"{{ onFullName }}\" placeholder=\"Given and family name\" style=\"padding: 13px 14px; border: 1px solid var(--line); background: var(--surface); font-size: 16px;\">\n              <\u002Flabel>\n              <label style=\"display: flex; flex-direction: column; gap: 8px;\">\n                <span style=\"font-size: 13px; color: var(--muted);\">Company / organization<\u002Fspan>\n                <input value=\"{{ f.company }}\" sc-camel-on-change=\"{{ onCompany }}\" placeholder=\"Organization name\" style=\"padding: 13px 14px; border: 1px solid var(--line); background: var(--surface); font-size: 16px;\">\n              <\u002Flabel>\n              <label style=\"display: flex; flex-direction: column; gap: 8px;\">\n                <span style=\"font-size: 13px; color: var(--muted);\">Position<\u002Fspan>\n                <input value=\"{{ f.position }}\" sc-camel-on-change=\"{{ onPosition }}\" placeholder=\"Job title\" style=\"padding: 13px 14px; border: 1px solid var(--line); background: var(--surface); font-size: 16px;\">\n              <\u002Flabel>\n              <label style=\"display: flex; flex-direction: column; gap: 8px;\">\n                <span style=\"font-size: 13px; color: var(--muted);\">Country<\u002Fspan>\n                <input value=\"{{ f.country }}\" sc-camel-on-change=\"{{ onCountry }}\" placeholder=\"Country of residence\" style=\"padding: 13px 14px; border: 1px solid var(--line); background: var(--surface); font-size: 16px;\">\n              <\u002Flabel>\n              <label style=\"display: flex; flex-direction: column; gap: 8px;\">\n                <span style=\"font-size: 13px; color: var(--muted);\">Email<\u002Fspan>\n                <input value=\"{{ f.email }}\" sc-camel-on-change=\"{{ onEmail }}\" placeholder=\"name@company.com\" style=\"padding: 13px 14px; border: 1px solid var(--line); background: var(--surface); font-size: 16px;\">\n              <\u002Flabel>\n              <label style=\"display: flex; flex-direction: column; gap: 8px;\">\n                <span style=\"font-size: 13px; color: var(--muted);\">Phone number<\u002Fspan>\n                <input value=\"{{ f.phone }}\" sc-camel-on-change=\"{{ onPhone }}\" placeholder=\"Including country code\" style=\"padding: 13px 14px; border: 1px solid var(--line); background: var(--surface); font-size: 16px;\">\n              <\u002Flabel>\n            <\u002Fdiv>\n\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .16em; color: var(--muted); margin: 48px 0 18px;\">03 · INTERESTS &amp; REQUIREMENTS<\u002Fdiv>\n            <div data-r=\"g2\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 20px;\">\n              <label style=\"display: flex; flex-direction: column; gap: 8px;\">\n                <span style=\"font-size: 13px; color: var(--muted);\">Area of interest<\u002Fspan>\n                <sc-raw-select value=\"{{ f.interest }}\" sc-camel-on-change=\"{{ onInterest }}\" style=\"padding: 13px 14px; border: 1px solid var(--line); background: var(--surface); font-size: 16px;\">\n e('autoplay', '');\n    v.setAttribute('loop', '');\n    v.src = 'assets/hero.mp4';\n    v.load();\n    const play = () => { const p = v.play(); if (p && p.catch) p.catch(() => {}); };\n    play();\n    v.addEventListener('loadeddata', play, { once: true });\n    v.addEventListener('canplay', play, { once: true });\n    // Low Power Mode and some in-app browsers block autoplay outright:\n    // start on the visitor's first touch instead.\n    const kick = () => { play(); };\n    ['touchstart', 'pointerdown', 'click', 'scroll'].forEach(ev =>\n      window.addEventListener(ev, kick, { once: true, passive: true })\n    );\n    document.addEventListener('visibilitychange', () => {\n      if (!document.hidden && v.paused) play();\n    });\n  }\n\n  componentDidMount() {\n    const initial = this.pageFromPath();\n    if (initial && initial !== this.state.page) this.setState({ page: initial });\n    this.onPop = () => { const p = this.pageFromPath(); if (p) this.setState({ page: p, navOpen: false }); };\n    window.addEventListener('popstate', this.onPop);\n    this.onOutbound = e => {\n      const a = e.target.closest && e.target.closest('a[href^=\"http\"]');\n      if (a && a.hostname !== location.hostname) this.track(/rmafc\\.gov\\.ng/.test(a.hostname) ? 'official_site_click' : 'outbound_click', { link_url: a.href, link_text: (a.textContent || '').trim().slice(0, 60) });\n    };\n    document.addEventListener('click', this.onOutbound, true);\n    setTimeout(() => this.syncHead(), 0);\n    this.t = setInterval(() => this.setState({ now: Date.now() }), 1000);\n    this.mountHeroVideo();\n    try {\n      const q = new URLSearchParams(location.search).get('lang');\n      if (q === 'zh' || q === 'en') { this.setState({ lang: q }); localStorage.setItem('rmafc-lang', q); }\n      else { const l = localStorage.getItem('rmafc-lang'); if (l) this.setState({ lang: l }); }\n    } catch (e) {}\n    this.applyLang();\n    try {\n      if (!localStorage.getItem('rmafc-official-seen') t.PAGES[this.state.page] || Component.PAGES.home;\n    const zh = this.isZh();\n    document.title = zh ? m.title.replace('2026 Oil & Gas Investment Summit', '2026 尼日利亚油气投资峰会') : m.title;\n    const set = (sel, attr, val) => {\n      let el = document.head.querySelector(sel);\n      if (!el) {\n        const m2 = sel.match(/^(\\w+)\\[(\\w+(?::\\w+)?)=\"([^\"]+)\"\\](?:\\[(\\w+)=\"([^\"]+)\"\\])?$/);\n        if (!m2) return;\n        el = document.createElement(m2[1]); el.setAttribute(m2[2], m2[3]); if (m2[4]) el.setAttribute(m2[4], m2[5]);\n        document.head.appendChild(el);\n      }\n      el.setAttribute(attr, val);\n    };\n    const origin = location.origin && location.origin !== 'null' ? location.origin : 'https://www.rmafcinvestmentsummit2026.org';\n    const url = origin + m.path;\n    set('meta[name=\"description\"]', 'content', m.desc);\n    set('meta[property=\"og:title\"]', 'content', m.title);\n    set('meta[property=\"og:description\"]', 'content', m.desc);\n    set('meta[property=\"og:url\"]', 'content', url);\n    const zhUrl = url + '?lang=zh';\n    set('link[rel=\"canonical\"]', 'href', zh ? zhUrl : url);\n    set('link[rel=\"alternate\"][hreflang=\"en\"]', 'href', url);\n    set('link[rel=\"alternate\"][hreflang=\"zh-Hans\"]', 'href', zhUrl);\n    set('link[rel=\"alternate\"][hreflang=\"x-default\"]', 'href', url);\n    set('meta[property=\"og:url\"]', 'content', zh ? zhUrl : url);\n    set('meta[name=\"twitter:title\"]', 'content', m.title);\n    set('meta[name=\"twitter:description\"]', 'content', m.desc);\n    set('meta[property=\"og:locale\"]', 'content', zh ? 'zh_CN' : 'en_GB');\n    document.documentElement.setAttribute('lang', zh ? 'zh-Hans' : 'en');\n    if (this._lastTracked !== this.state.page) {\n      this._lastTracked = this.state.page;\n      this.track('page_view', { page_title: m.title, page_location: url + location.search, page_path: m.path, language: zh ? 'zh' : 'en' });\n    }\n  }\n  go(page, quiet) {\n    return (e) => {\n      if (e && (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1)) return;\n      if (e && e.preventDefault) e.preventDefault();\n      if (page === 'register' && !quiet) this.track('register_click', { from_page: this.state.page });\n      this.setState({ page, note: '', err: false, navOpen: false });\n      if (this.routed()) {\n        const target = Component.PAGES[page].path + location.search;\n        if (location.pathname + location.search !== target) history.pushState({ page }, '', target);\n      }\n      if (typeof window !== 'undefined') window.scrollTo({ top: 0 });\n    };\n  }\n  hrefFor(page) { return Component.PAGES[page].path + (this.isZh() ? '?lang=zh' : ''); }\n  field(k) { return e => this.setState(s => ({ form: { ...s.form, [k]: e.target.value } })); }\n\n  fileInput = React.createRef();\n  MAX_BYTES = 4 * 1024 * 1024;\n\n  sizeLabel(n) {\n    if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';\n    if (n >= 1024) return Math.round(n / 1024) + ' KB';\n    return n + ' B';\n  }\n\n  addFiles(list) {\n    const incoming = Array.from(list || []);\n    if (!incoming.length) return;\n    this.setState(s => {\n      const existing = new Set(s.files.map(f => f.name + '|' + f.size));\n      const added = [];\n      let rejected = 0;\n      for (const file of incoming) {\n        if (existing.has(file.name + '|' + file.size)) continue;\n        if (file.size > this.MAX_BYTES) { rejected++; continue; }\n        added.push({ id: Math.random().toString(36).slice(2), file, name: file.name, size: file.size });\n      }\n      const total = s.files.length + added.length;\n      return {\n        files: s.files.concat(added).slice(0, 20),\n        note: rejected ? `${rejected} file${rejected > 1 ? 's' : ''} exceeded the 4 MB limit and ${rejected > 1 ? 'were' : 'was'} not added. Please share large media as a link in “Other relevant information”.` : s.note,\n        err: rejected > 0,\n        dragging: false\n      };\n    });\n  }\n\n  async postUplo
